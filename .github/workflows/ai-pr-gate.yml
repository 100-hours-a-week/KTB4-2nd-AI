name: AI PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ai-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: ap-northeast-2
          AWS_EC2_METADATA_DISABLED: "true"

      - name: Check whether the model runtime changed
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
            grep -Eq '^(app/engines/|app/pipeline/bootstrap\.py$|app/core/config\.py$|scripts/(fetch_model|runtime_check)\.py$|docker/|pyproject\.toml$|uv\.lock$)'; then
            echo 'model_runtime=true' >> "$GITHUB_OUTPUT"
          else
            echo 'model_runtime=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Compute model cache key
        id: model
        run: echo "key=$(uv run scripts/fetch_model.py --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Cache model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models/siglip2
          key: model-${{ steps.model.outputs.key }}

      - name: Fetch model if cache missed
        run: uv run scripts/fetch_model.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Check model load and one-image inference
        if: steps.changes.outputs.model_runtime == 'true'
        run: uv run scripts/runtime_check.py --skip-qdrant

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build worker image without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize checks
        if: always()
        run: |
          {
            echo '### AI PR Gate'
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Model runtime check needed: ${{ steps.changes.outputs.model_runtime || 'unknown' }}"
            echo "- Job result: ${{ job.status }}"
            echo '- Docker image: build only, no push'
          } >> "$GITHUB_STEP_SUMMARY"
