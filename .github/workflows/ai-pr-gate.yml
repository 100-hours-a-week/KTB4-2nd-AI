name: AI PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ai-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: AI checks and tests (shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      model_runtime: ${{ steps.changes.outputs.model_runtime }}
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
      redis:
        image: redis:7.4.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Record execution context
        run: bash .github/scripts/record-ci-context.sh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Set up uv
        id: uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Verify PR gate failure handling
        run: uv run python -m unittest discover -s .github/tests -p 'test_*.py'

      - name: Validate standalone embedding service configuration
        run: docker compose -f docker/embedding/compose.yaml config --quiet
        env:
          VLLM_EMBEDDING_IMAGE: vllm/vllm-openai:validation-only
          EMBEDDING_MODEL: validation/model
          EMBEDDING_MODEL_REVISION: validation-revision
          EMBEDDING_SERVED_MODEL_NAME: validation-embedding
          EMBEDDING_API_KEY: validation-only

      - name: Validate v2 deployment configurations
        run: |
          cp docker/v2/.env.example docker/v2/.env
          docker compose --env-file docker/v2/.env -f docker/v2/compose.yaml config --quiet
          docker compose -f docker/generation/compose.yaml config --quiet
        env:
          AI_APP_IMAGE: yeodam-ai-app:validation-only
          QDRANT_DATA_DIR: /tmp/yeodam-qdrant-validation
          EMBEDDING_API_KEY: validation-only
          VLLM_GENERATION_IMAGE: vllm/vllm-openai:validation-only
          GENERATION_MODEL: validation/model
          GENERATION_MODEL_REVISION: validation-revision
          GENERATION_SERVED_MODEL_NAME: validation-generation
          GENERATION_API_KEY: validation-only

      - name: Validate local jobs configuration
        run: |
          cp docker/jobs/.env.example docker/jobs/.env
          docker compose -f docker/jobs/compose.yaml config --quiet

      - name: Test
        run: uv run python .github/ci/test_timing.py run
        env:
          AI_TEST_SHARDS: "2"
          AI_TEST_SHARD: ${{ matrix.shard }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UV_VERSION: ${{ steps.uv.outputs.uv-version }}
          UV_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
          JOBS_TEST_REDIS_URL: redis://127.0.0.1:6379/0
          JOBS_TEST_KAFKA_URL: localhost:9092
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: ap-northeast-2
          AWS_EC2_METADATA_DISABLED: "true"

      - name: Summarize test measurement
        if: always()
        run: uv run python .github/ci/test_timing.py report

      - name: Upload test measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-test-timing-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: build/ci-timing/
          retention-days: 7
          if-no-files-found: error

      - name: Check whether the model runtime changed
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
            grep -Eq '^(app/(engines|embedding)/|app/pipeline/bootstrap\.py$|app/core/config\.py$|scripts/(fetch_model|runtime_check)\.py$|docker/|pyproject\.toml$|uv\.lock$)'; then
            echo 'model_runtime=true' >> "$GITHUB_OUTPUT"
          else
            echo 'model_runtime=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Compute model cache key
        if: steps.changes.outputs.model_runtime == 'true' && matrix.shard == 1
        id: model
        run: echo "key=$(uv run scripts/fetch_model.py --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Cache model weights
        if: steps.changes.outputs.model_runtime == 'true' && matrix.shard == 1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models/siglip2
          key: model-${{ steps.model.outputs.key }}

      - name: Fetch model if cache missed
        if: steps.changes.outputs.model_runtime == 'true' && matrix.shard == 1
        run: uv run scripts/fetch_model.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Check model load and one-image inference
        if: steps.changes.outputs.model_runtime == 'true' && matrix.shard == 1
        run: uv run scripts/runtime_check.py --skip-qdrant

  build-v1:
    name: AI V1 image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Record execution context
        run: bash .github/scripts/record-ci-context.sh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Compute model cache key
        id: model
        run: echo "key=$(uv run scripts/fetch_model.py --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Cache model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models/siglip2
          key: model-${{ steps.model.outputs.key }}

      - name: Fetch model if cache missed
        run: uv run scripts/fetch_model.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build worker image without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-v2:
    name: AI V2 image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Record execution context
        run: bash .github/scripts/record-ci-context.sh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build v2 app image without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/jobs/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha,scope=jobs
          cache-to: type=gha,scope=jobs,mode=max

  ai-ci-gate:
    name: ai-ci-gate
    if: always()
    needs: [tests, build-v1, build-v2]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require tests and both images
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          V1_RESULT: ${{ needs['build-v1'].result }}
          V2_RESULT: ${{ needs['build-v2'].result }}
        run: |
          if [[ "$TESTS_RESULT" != success || "$V1_RESULT" != success || "$V2_RESULT" != success ]]; then
            echo "AI tests: $TESTS_RESULT; V1 build: $V1_RESULT; V2 build: $V2_RESULT" >&2
            exit 1
          fi

      - name: Checkout aggregate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download test measurement
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ai-test-timing-${{ github.run_id }}-${{ github.run_attempt }}-shard-*
          path: build/ci-inputs

      - name: Verify complete test coverage
        run: >-
          python3 .github/ci/test_shards.py aggregate
          --root build/ci-inputs --count 2
          --output build/ci-timing/aggregate.json

      - name: Upload verified test coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-test-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-timing/aggregate.json
          retention-days: 7
          if-no-files-found: error

      - name: Summarize checks
        if: always()
        run: |
          {
            echo '### AI PR Gate'
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Model runtime check needed: ${{ needs.tests.outputs.model_runtime || 'unknown' }}"
            echo "- Tests: ${{ needs.tests.result }}"
            echo "- V1 image: ${{ needs['build-v1'].result }}"
            echo "- V2 image: ${{ needs['build-v2'].result }}"
            echo "- Job result: ${{ job.status }}"
            echo '- Docker image: build only, no push'
          } >> "$GITHUB_STEP_SUMMARY"
