# Temporary AI #116 positive-branch validation, excluded from A/B timing.
# Force only the selector output; execute the unchanged real model preparation/inference steps.
# CPU on the GitHub Runner only; no AWS GPU or RunPod. Remove after validation.
name: AI model prep required branch validation
'on':
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
permissions:
  contents: read
concurrency:
  group: ai-model-prep-required-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  required-model-runtime:
    name: AI required model preparation and inference
    if: github.head_ref == '116-chore-ai-pr의-불필요한-모델-준비-생략'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: '0'
    - name: Record execution context
      run: bash .github/scripts/record-ci-context.sh
      env:
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    - name: Set up uv
      id: uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        version: 0.12.15
        enable-cache: 'true'
    - name: Install locked dependencies
      run: uv sync --frozen
    - name: Select required validation branch
      id: changes
      run: echo 'model_runtime=true' >> "$GITHUB_OUTPUT"
    - name: Compute model cache key
      if: steps.changes.outputs.model_runtime == 'true'
      id: model
      run: echo "key=$(uv run scripts/fetch_model.py --cache-key)" >> "$GITHUB_OUTPUT"
    - name: Cache model weights
      if: steps.changes.outputs.model_runtime == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: models/siglip2
        key: model-${{ steps.model.outputs.key }}
      id: weights
    - name: Fetch model if cache missed
      if: steps.changes.outputs.model_runtime == 'true'
      run: uv run scripts/fetch_model.py
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      id: fetch
    - name: Check model load and one-image inference
      if: steps.changes.outputs.model_runtime == 'true'
      run: uv run scripts/runtime_check.py --skip-qdrant
      id: runtime
    - name: Require all model preparation and runtime checks
      if: always()
      env:
        MODEL_RESULT: ${{ steps.model.outcome }}
        WEIGHTS_RESULT: ${{ steps.weights.outcome }}
        FETCH_RESULT: ${{ steps.fetch.outcome }}
        RUNTIME_RESULT: ${{ steps.runtime.outcome }}
      run: |
        for result in "$MODEL_RESULT" "$WEIGHTS_RESULT" "$FETCH_RESULT" "$RUNTIME_RESULT"; do
          if [[ "$result" != success ]]; then
            echo 'Required model preparation or runtime check did not succeed' >&2
            exit 1
          fi
        done
        echo 'All required model preparation and real CPU runtime checks succeeded' >> "$GITHUB_STEP_SUMMARY"
