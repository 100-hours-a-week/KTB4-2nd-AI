name: AI v2 App Image
on:
  push:
    branches: [main]
    paths: ['app/**', 'docker/jobs/Dockerfile', 'pyproject.toml', 'uv.lock', '.github/workflows/ai-v2-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: image
        with:
          context: .
          file: docker/jobs/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/yeodam-ai-app:sha-${{ github.sha }}
          cache-from: type=gha,scope=jobs
          cache-to: type=gha,scope=jobs,mode=max
      - name: Record staging candidate
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/yeodam-ai-app:sha-${{ github.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo '### AI V2 Manifest candidate'
            echo "SOURCE_SHA=${GITHUB_SHA}"
            echo "BUILD_RUN_ID=${GITHUB_RUN_ID}"
            echo "AI_APP_IMAGE=${IMAGE}"
            echo "AI_APP_DIGEST=${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'This image requires staging validation before production deployment.' >> "$GITHUB_STEP_SUMMARY"
      - name: Notify Cloud V2 release manifest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.CLOUD_RELEASE_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/yeodam-ai-app:sha-${{ github.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          jq -n \
            --arg component ai-app \
            --arg source_repository "${GITHUB_REPOSITORY}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg image "${IMAGE}" \
            --arg digest "${DIGEST}" \
            --arg build_run_id "${GITHUB_RUN_ID}" \
            '{
              event_type: "v2-image-published",
              client_payload: {
                component: $component,
                source_repository: $source_repository,
                source_sha: $source_sha,
                image: $image,
                digest: $digest,
                build_run_id: $build_run_id
              }
            }' |
            gh api \
              --method POST \
              repos/100-hours-a-week/KTB4-2nd-Cloud/dispatches \
              --input -
