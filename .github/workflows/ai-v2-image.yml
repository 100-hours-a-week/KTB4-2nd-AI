name: AI v2 App Image
on:
  push:
    branches: [main]
    paths: ['app/**', 'docker/jobs/Dockerfile', 'pyproject.toml', 'uv.lock', '.github/workflows/ai-v2-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: image
        with:
          context: .
          file: docker/jobs/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/yeodam-ai-app:sha-${{ github.sha }}
          cache-from: type=gha,scope=jobs
          cache-to: type=gha,scope=jobs,mode=max
      - name: Record staging candidate
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/yeodam-ai-app:sha-${{ github.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "AI_APP_IMAGE=${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo 'This image requires staging validation before production deployment.' >> "$GITHUB_STEP_SUMMARY"
