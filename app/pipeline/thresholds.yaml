# 파이프라인 임계값, 모델별. 인터페이스 3
# 키 8개는 steps/가 ctx.thresholds["키"]로 읽음. 이름을 바꾸면 steps/와 여기를 같이
# 값은 파이프라인 담당이 평가셋으로 측정해 교체
# FAKE_PIPELINE=1이면 이 파일을 읽지 않음

siglip2-so400m-naflex:
  inherit_min_sim: 0.89             # LOCATING. GPS 없는 사진이 좌표를 물려받는 코사인 유사도 하한
  dbscan_eps_m: 100                 # CLUSTERING. DBSCAN eps, 미터
  min_samples: 1                    # CLUSTERING. 1이면 사진 한 장도 폴더
  blur_var_min: 80.0                # FILTERING. 긴 변 최대 1024px 라플라시안 분산 하한, 미만이면 BLURRY
  phash_max_dist: 4                 # FILTERING. pHash 해밍 거리 상한, 이하면 DUPLICATED
  clock_pair_min_sim: 0.8           # CLOCK. 기준 기기와 대상 기기 사진을 쌍으로 묶는 유사도 하한
  clock_min_pairs: 3                # CLOCK. 사진 재사용 없는 상호 유일 최고 유사도 쌍의 최소 수
  # CLOCK. 같은 정수 일수 후보 안에서 초 단위 오프셋의 중앙값 ± 허용 오차인 쌍만 집계
  clock_offset_tolerance_sec: 1800  # 0 이상 반일 미만. 실제 시각에는 정수 일수만 적용
