# 검색과 사진 정리가 공유하는 임베딩 추론 서버. Python 작업 실행기를 포함하지 않는다.
services:
  embedding:
    image: ${VLLM_EMBEDDING_IMAGE:?Set a validated vLLM image tag or digest}
    entrypoint: ["vllm", "serve"]
    command:
      - ${EMBEDDING_MODEL:?Set the embedding model repository}
      - --revision
      - ${EMBEDDING_MODEL_REVISION:?Set the model revision}
      - --runner
      - pooling
      - --served-model-name
      - ${EMBEDDING_SERVED_MODEL_NAME:?Set the public model name}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      VLLM_API_KEY: ${EMBEDDING_API_KEY:?Set the embedding API key}
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "${EMBEDDING_BIND_HOST:-127.0.0.1}:${EMBEDDING_PORT:-8003}:8000"
    volumes:
      - embedding-model-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  embedding-model-cache:
