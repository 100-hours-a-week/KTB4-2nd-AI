# RunPod 생성 서버의 실행 계약, RunPod 템플릿 Container Start Command와 같은 인자
services:
  generation:
    image: ${VLLM_GENERATION_IMAGE:?Set a validated vLLM image tag or digest}
    entrypoint: ["vllm", "serve"]
    command:
      - ${GENERATION_MODEL:?Set the generation model repository}
      - --revision
      - ${GENERATION_MODEL_REVISION:?Set the model revision}
      - --tokenizer-revision
      - ${GENERATION_MODEL_REVISION:?Set the model revision}
      - --served-model-name
      - ${GENERATION_SERVED_MODEL_NAME:?Set the public model name}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - ${GENERATION_MAX_MODEL_LEN:-16384}
      - --gpu-memory-utilization
      - ${GENERATION_GPU_MEMORY_UTILIZATION:-0.90}
      - --max-num-seqs
      - ${GENERATION_MAX_NUM_SEQS:-8}
      - --limit-mm-per-prompt
      - '{"image": ${GENERATION_MAX_IMAGES:-10}, "audio": 0, "video": 0}'
      - --scheduling-policy
      - priority
      # 볼륨에서 가중치를 읽을 때 미리 페이지 캐시에 올림, RunPod 재시작 약 11분에서 약 3분
      - --safetensors-load-strategy
      - prefetch
    environment:
      VLLM_API_KEY: ${GENERATION_API_KEY:?Set the generation API key}
      HF_TOKEN: ${HF_TOKEN:-}
    ports: ["${GENERATION_BIND_HOST:-127.0.0.1}:${GENERATION_PORT:-8004}:8000"]
    volumes:
      - generation-model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  generation-model-cache:
