global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/yeodam-rules.yml
scrape_configs:
  - job_name: yeodam-ai
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/ai_api_key
    file_sd_configs:
      - files: [/etc/prometheus/yeodam-targets.json]
